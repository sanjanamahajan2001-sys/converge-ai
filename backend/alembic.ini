# ==============================================================================
# Alembic Configuration for Converge AI
# ==============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Default fallback URL (overridden dynamically in env.py from settings)
sqlalchemy.url = postgresql+psycopg2://converge_ai_owner:local_owner_secret@127.0.0.1:5432/converge_ai_db

[logging]
default_level = INFO

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
